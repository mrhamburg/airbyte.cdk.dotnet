connector:
  module: LocalParquet
  type: destination

source:
  connector: ../source-exchange-rates-free
  config:
    start_date: "{{today-7}}"
    base: USD

tests:
  - name: full refresh overwrite over protobuf
    timeout_seconds: 600
    config: {}
    streams:
      - name: symbols
      - name: latest

  - name: incremental append over protobuf
    timeout_seconds: 600
    config: {}
    streams:
      - name: historical
        sync_mode: incremental
        state:
          historical:
            USD: "{{today-3}}"
