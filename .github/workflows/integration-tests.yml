name: Connector Integration Tests

# Credentials live in the `integration` environment, whose deployment branch policy allows `main` only. GitHub
# checks that policy against the ref of the run, so a branch or a pull request is refused the environment secrets
# however the workflow is edited. There is deliberately no `pull_request` trigger: that event runs the workflow
# file of the pull request head with the repository's secrets.
#
# The secret store is not reachable from the public internet: it sits behind a NetBird network, so the
# credentialed job joins that network with an ephemeral setup key before it reads a secret.
#
# One-time setup (repository admin):
#   * environment `integration` -> Deployment branches and tags -> Selected branches: main
#   * environment secrets
#       SECRETS_POSTGRESQL_CONNECTION_STRING, SECRETS_POSTGRESQL_ENCRYPTION_KEY
#       NETBIRD_SETUP_KEY (ephemeral), NETBIRD_MANAGEMENT_URL (self-hosted only; empty means NetBird cloud)
#   * delete the repository-level copies of those secrets, otherwise `secrets.*` still resolves outside the
#     environment
#   * optional: required reviewers, so every post-merge run also needs a human approval
on:
  push:
    branches: [ main ]
    paths:
      - 'airbyte-integrations/connectors/**'
  workflow_dispatch:
    inputs:
      connector:
        description: 'Connector name or directory, for example source-exchange-rates-free'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: connector-integration-${{ github.ref }}

jobs:
  changed:
    name: Discover changed connectors
    runs-on: ubuntu-latest
    outputs:
      connectors: ${{ steps.list.outputs.connectors }}
      has_connectors: ${{ steps.list.outputs.has_connectors }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build harness
        run: dotnet build tests/Airbyte.Cdk.IntegrationTests -c Release

      - name: Determine changed files
        shell: bash
        env:
          INPUT_CONNECTOR: ${{ inputs.connector }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_CONNECTOR" ]; then
            connector="$INPUT_CONNECTOR"
            case "$connector" in
              airbyte-integrations/connectors/*) ;;
              *) connector="airbyte-integrations/connectors/$connector" ;;
            esac
            echo "$connector/integration_tests.yaml" > "$RUNNER_TEMP/changed.txt"
          else
            # A manual run has no before-sha, so it compares against the previous commit.
            base="$BEFORE_SHA"
            if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
              base="HEAD~1"
            fi
            git diff --name-only --diff-filter=d "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          fi
          echo "Changed files:"
          cat "$RUNNER_TEMP/changed.txt"

      - name: Map changes to connectors
        id: list
        shell: bash
        run: |
          # --no-build keeps compiler and analyzer warnings out of stdout, which would otherwise corrupt
          # the JSON this step publishes as the build matrix.
          connectors=$(dotnet run --no-build -c Release --project tests/Airbyte.Cdk.IntegrationTests -- \
            list-changed --changed-files "$RUNNER_TEMP/changed.txt" --json)
          echo "connectors=$connectors" >> "$GITHUB_OUTPUT"
          if [ "$connectors" = "[]" ]; then
            echo "has_connectors=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_connectors=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Connectors to test: $connectors"

  integration:
    name: ${{ matrix.connector }}
    needs: changed
    if: needs.changed.outputs.has_connectors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment's deployment branch policy is the control that keeps the store away from branch code.
    environment: integration
    # The secret store sits behind a NetBird network, so the runner joins it with an ephemeral setup key. Empty
    # means no NetBird secret is configured yet, and the step is skipped instead of failing the job.
    env:
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      NETBIRD_MANAGEMENT_URL: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJson(needs.changed.outputs.connectors) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Connect to the NetBird network
        if: env.NETBIRD_SETUP_KEY != ''
        uses: Alemiz112/netbird-connect@fbea46300ca7ee907ff7d8e39ede3f556a6ecf10 # v1.0.2
        with:
          setup-key: ${{ env.NETBIRD_SETUP_KEY }}
          hostname: gh-${{ github.run_id }}-${{ strategy.job-index }}
          management-url: ${{ env.NETBIRD_MANAGEMENT_URL || 'https://api.netbird.io:443' }}
          # The store is reached through a route one of the peers advertises.
          args: --accept-routes

      - name: Run integration tests
        shell: bash
        env:
          CONNECTOR: ${{ matrix.connector }}
          EVENT_NAME: ${{ github.event_name }}
          # The environment supplies these; nothing is stored at repository level. A PostgreSQL store wins when
          # it is configured, otherwise a JSON object can supply the same keys.
          SECRETS_POSTGRESQL_CONNECTION_STRING: ${{ secrets.SECRETS_POSTGRESQL_CONNECTION_STRING }}
          SECRETS_POSTGRESQL_ENCRYPTION_KEY: ${{ secrets.SECRETS_POSTGRESQL_ENCRYPTION_KEY }}
          AIRBYTE_INTEGRATION_SECRETS_JSON: ${{ secrets.AIRBYTE_INTEGRATION_SECRETS_JSON }}
        run: |
          # A skipped scenario on main is a failure, because a skip there looks green while proving nothing.
          # That only holds once a secret store is configured: before the first credentials exist every key is
          # missing, and enforcing it would make every credentialed connector red.
          extra=""
          if [ "$EVENT_NAME" = "push" ] && [ -n "$SECRETS_POSTGRESQL_CONNECTION_STRING$AIRBYTE_INTEGRATION_SECRETS_JSON" ]; then
            extra="--no-skip"
          fi
          dotnet run --project tests/Airbyte.Cdk.IntegrationTests -- run --connector "$CONNECTOR" $extra

      - name: Leave the NetBird network
        # Also runs when the tests fail, so the peer does not stay connected. The setup key should be ephemeral as
        # well, so the peer record disappears with the runner.
        if: always() && env.NETBIRD_SETUP_KEY != ''
        shell: bash
        run: sudo netbird down
